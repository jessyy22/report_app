name: report_app
description: "A Report App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  image_picker: ^1.2.1
  geocoding: ^4.0.0
  intl: ^0.20.2
  flutter_launcher_icons: "^0.14.4"
  http: ^1.2.1
  shared_preferences: ^2.2.3
  supabase_flutter: ^2.0.0
  turf: ^0.0.12
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  app_links: ^6.4.1


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/trike1.png
    - assets/icons/rtoda-icon.png
    - assets/images/vigan logo.gif
    - assets/images/pstmd.jpg
    - assets/images/pstmd.png
    - assets/images/app_icon.png
    